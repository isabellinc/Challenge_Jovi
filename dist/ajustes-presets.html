<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/output.css">
    <title>Ajustes de Preset - JOVI Smartshot</title>
</head>

        <style>
            /* ==== Slider (range) customizado ==== */
            input[type="range"] {
                -webkit-appearance: none;
                appearance: none;
                width: 100%;
                height: 4px;
                border-radius: 9999px;
                background: #3f3f46; /* zinc-700 */
                outline: none;
            }
            input[type="range"]::-webkit-slider-thumb {
                -webkit-appearance: none;
                appearance: none;
                width: 16px;
                height: 16px;
                border-radius: 9999px;
                background: #f59e0b; /* amber-500 */
                cursor: pointer;
                box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15);
            }
            input[type="range"]::-moz-range-thumb {
                width: 16px;
                height: 16px;
                border: none;
                border-radius: 9999px;
                background: #f59e0b;
                cursor: pointer;
                box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15);
            }
            input[type="range"]::-moz-range-track {
                height: 4px;
                border-radius: 9999px;
                background: #3f3f46;
            }

            /* ==== Toast ==== */
            #toast {
                transition: opacity .25s ease, transform .25s ease;
            }
        </style>
</head>
<body class="bg-zinc-950 min-h-dvh w-full flex items-center justify-center overflow-hidden font-sans">
<div id="app-frame" class="relative bg-black text-white w-full h-dvh sm:h-[860px] sm:max-h-[94vh] sm:w-[430px] sm:rounded-[2.5rem] sm:border sm:border-zinc-800 sm:shadow-2xl overflow-hidden flex flex-col p-6">

    <!-- ==================================================================== -->
    <!-- VIEW A — Ajustes do preset (nome, categoria, descrição, visibilidade) -->
    <!-- ==================================================================== -->
    <div id="view-settings" class="flex flex-col h-full w-full overflow-hidden">

        <header class="flex items-center justify-between w-full p-4 shrink-0">
            <a href="presets.html" class="shrink-0" aria-label="Voltar">
                <img class="w-6 h-6 object-contain" src="./assets/presets/seta-esquerda.png" alt="seta para voltar">
            </a>
            <h1 class="text-2xl text-center flex-1 font-normal">AJUSTES</h1>
            <button id="btn-save-settings" class="w-6 h-6 shrink-0 flex items-center justify-center" aria-label="Salvar preset">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full">
                    <path d="M20 6 9 17l-5-5"/>
                </svg>
            </button>
        </header>

        <main class="flex-1 overflow-y-auto flex flex-col gap-5 px-2 pb-4">

            <!-- Imagem do preset + Comparar -->
            <div class="relative w-full h-48 rounded-2xl overflow-hidden shrink-0">
                <img class="w-full h-full object-cover" src="./assets/ajustes/bolinhas-de-gude.jpg" alt="foto de várias balas">
                <button id="btn-open-adjust" class="absolute top-3 right-3 flex items-center gap-1.5 bg-black/60 backdrop-blur-sm px-3 py-1.5 rounded-full text-xs font-medium hover:bg-black/75 transition-colors">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5">
                        <path d="M8 7 4 11l4 4M4 11h16M16 7l4 4-4 4M20 11H4"/>
                    </svg>
                    Comparar
                </button>
            </div>

            <!-- Nome do preset -->
            <div>
                <label for="input-nome" class="text-sm text-zinc-300 mb-1.5 block">Nome do preset</label>
                <input id="input-nome" type="text" value="Detalhe"
                       class="w-full bg-zinc-800 rounded-xl px-4 py-3 text-sm text-white outline-none focus:ring-2 focus:ring-amber-500 transition-shadow">
            </div>

            <!-- Categoria -->
            <div>
                <label class="text-sm text-zinc-300 mb-2 block">Categoria</label>
                <div id="category-group" class="grid grid-cols-5 gap-2">
                    <button type="button" data-category="carro" class="category-btn flex flex-col items-center justify-center gap-1.5 py-3 rounded-xl bg-zinc-800 border-2 border-transparent transition-colors">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                            <path d="M3 13l1.5-4.5A2 2 0 0 1 6.4 7h11.2a2 2 0 0 1 1.9 1.5L21 13M3 13v5a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1h12v1a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-5M3 13h18"/>
                            <circle cx="7" cy="17" r="1"/><circle cx="17" cy="17" r="1"/>
                        </svg>
                        <span class="text-[11px] text-zinc-300">Carro</span>
                    </button>
                    <button type="button" data-category="retrato" class="category-btn flex flex-col items-center justify-center gap-1.5 py-3 rounded-xl bg-zinc-800 border-2 border-transparent transition-colors">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                            <circle cx="12" cy="8" r="3.2"/>
                            <path d="M5.5 20a6.5 6.5 0 0 1 13 0"/>
                        </svg>
                        <span class="text-[11px] text-zinc-300">Retrato</span>
                    </button>
                    <button type="button" data-category="urbano" class="category-btn flex flex-col items-center justify-center gap-1.5 py-3 rounded-xl bg-zinc-800 border-2 border-transparent transition-colors">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                            <path d="M4 21V9l5-3v15M9 21V6l6 3v12M15 21V9l5 3v9M4 21h16"/>
                        </svg>
                        <span class="text-[11px] text-zinc-300">Urbano</span>
                    </button>
                    <button type="button" data-category="noturno" class="category-btn flex flex-col items-center justify-center gap-1.5 py-3 rounded-xl bg-zinc-800 border-2 border-transparent transition-colors">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/>
                        </svg>
                        <span class="text-[11px] text-zinc-300">Noturno</span>
                    </button>
                    <button type="button" data-category="filme" class="category-btn flex flex-col items-center justify-center gap-1.5 py-3 rounded-xl bg-zinc-800 border-2 border-transparent transition-colors">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                            <rect x="3" y="5" width="18" height="14" rx="1.5"/>
                            <path d="M3 9h4M3 15h4M17 9h4M17 15h4"/>
                        </svg>
                        <span class="text-[11px] text-zinc-300">Filme</span>
                    </button>
                </div>
            </div>

            <!-- Descrição -->
            <div>
                <label for="input-descricao" class="text-sm text-zinc-300 mb-1.5 block">Descrição (opcional)</label>
                <input id="input-descricao" type="text" value="Nitidez em detalhes minuciosos."
                       class="w-full bg-zinc-800 rounded-xl px-4 py-3 text-sm text-zinc-300 outline-none focus:ring-2 focus:ring-amber-500 transition-shadow">
            </div>

            <!-- Imagem de capa -->
            <div>
                <label class="text-sm text-zinc-300 mb-2 block">Imagem de capa</label>
                <div class="flex gap-3">
                    <div class="w-16 h-16 rounded-xl overflow-hidden shrink-0">
                        <img id="preview-capa" class="w-full h-full object-cover" src="./assets/ajustes/bolinhas-de-gude.jpg" alt="imagem de capa atual">
                    </div>
                    <label class="w-16 h-16 rounded-xl bg-zinc-800 flex items-center justify-center cursor-pointer hover:bg-zinc-700 transition-colors shrink-0">
                        <img class="w-5 h-5 object-contain" src="./assets/presets/plus.png" alt="Adicionar nova imagem de capa">
                        <input id="input-capa" type="file" accept="image/*" class="hidden">
                    </label>
                </div>
            </div>

            <!-- Visibilidade -->
            <div>
                <label class="text-sm text-zinc-300 mb-1.5 block">Visibilidade</label>
                <div class="relative">
                    <button id="btn-visibilidade" type="button"
                            class="w-full flex items-center justify-between bg-zinc-800 rounded-xl px-4 py-3 text-sm text-white hover:bg-zinc-700 transition-colors">
                        <span class="flex items-center gap-2">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="w-4 h-4">
                                <circle cx="12" cy="12" r="9"/>
                                <path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>
                            </svg>
                            <span id="visibilidade-label">Público</span>
                        </span>
                        <svg id="visibilidade-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 transition-transform">
                            <path d="m6 9 6 6 6-6"/>
                        </svg>
                    </button>
                    <div id="visibilidade-menu" class="hidden absolute left-0 right-0 mt-1.5 bg-zinc-800 rounded-xl overflow-hidden z-10 shadow-lg">
                        <button type="button" data-visibilidade="Público" class="visibilidade-opt w-full text-left px-4 py-3 text-sm hover:bg-zinc-700 transition-colors">Público</button>
                        <button type="button" data-visibilidade="Privado" class="visibilidade-opt w-full text-left px-4 py-3 text-sm hover:bg-zinc-700 transition-colors">Privado</button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- ==================================================================== -->
    <!-- VIEW B — Editor de ajustes (Luz / Cor / Efeito / Detalhe / Ótica)      -->
    <!-- ==================================================================== -->
    <div id="view-adjust" class="hidden flex-col h-full w-full overflow-hidden">

        <header class="flex items-center justify-between w-full p-4 shrink-0">
            <button id="btn-back-adjust" class="w-6 h-6 shrink-0" aria-label="Voltar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full">
                    <path d="m15 18-6-6 6-6"/>
                </svg>
            </button>
            <h1 class="text-2xl text-center flex-1 font-normal">AJUSTES</h1>
            <button id="btn-save-adjust" class="w-6 h-6 shrink-0 flex items-center justify-center" aria-label="Salvar ajustes">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full">
                    <path d="M20 6 9 17l-5-5"/>
                </svg>
            </button>
        </header>

        <main class="flex-1 overflow-y-auto flex flex-col gap-4 px-2 pb-2">

            <!-- Comparador antes/depois -->
            <div id="compare" class="relative w-full h-48 rounded-2xl overflow-hidden select-none shrink-0 cursor-ew-resize">
                <img class="absolute inset-0 w-full h-full object-cover" src="./assets/ajustes/bolinhas-de-gude.jpg" alt="antes">
                <img id="compare-after" class="absolute inset-0 w-full h-full object-cover" src="./assets/ajustes/bolinhas-de-gude.jpg" alt="depois"
                     style="clip-path: inset(0 0 0 50%); filter: contrast(1.18) saturate(1.25) brightness(1.04);">

                <span class="absolute top-2.5 left-2.5 text-[10px] font-medium bg-black/55 px-2 py-1 rounded-full">Antes</span>
                <span class="absolute top-2.5 right-2.5 text-[10px] font-medium bg-black/55 px-2 py-1 rounded-full">Depois</span>

                <div id="compare-line" class="absolute inset-y-0 w-0.5 bg-white/90" style="left:50%;"></div>
                <div id="compare-handle" class="absolute top-1/2 w-8 h-8 rounded-full bg-white/90 flex items-center justify-center -translate-x-1/2 -translate-y-1/2 shadow" style="left:50%;">
                    <svg viewBox="0 0 24 24" fill="#111" class="w-3.5 h-3.5 ml-0.5">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </div>
            </div>

            <!-- Abas de categorias de ajuste -->
            <div id="tabs" class="grid grid-cols-5 gap-1.5 shrink-0">
                <button type="button" data-tab="luz" class="tab-btn flex flex-col items-center justify-center gap-1 py-2.5 rounded-xl transition-colors">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
                    </svg>
                    <span class="text-[11px]">Luz</span>
                </button>
                <button type="button" data-tab="cor" class="tab-btn flex flex-col items-center justify-center gap-1 py-2.5 rounded-xl transition-colors">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                        <path d="M12 21a9 9 0 1 1 0-18c4.5 0 8 3 8 6.5 0 2-1.5 3.5-3.5 3.5H15a1.8 1.8 0 0 0-1 3.3c.4.3.6.7.6 1.2 0 1-1 1.7-2 1.7Z"/>
                        <circle cx="7.5" cy="10.5" r=".9" fill="currentColor" stroke="none"/>
                        <circle cx="12" cy="7.5" r=".9" fill="currentColor" stroke="none"/>
                        <circle cx="16.2" cy="10.2" r=".9" fill="currentColor" stroke="none"/>
                    </svg>
                    <span class="text-[11px]">Cor</span>
                </button>
                <button type="button" data-tab="efeito" class="tab-btn flex flex-col items-center justify-center gap-1 py-2.5 rounded-xl transition-colors">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                        <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2 2M16.4 16.4l2 2M5.6 18.4l2-2M16.4 7.6l2-2"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <span class="text-[11px]">Efeito</span>
                </button>
                <button type="button" data-tab="detalhe" class="tab-btn flex flex-col items-center justify-center gap-1 py-2.5 rounded-xl transition-colors">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                        <path d="M4 6h16M4 12h10M4 18h13"/>
                        <circle cx="19" cy="18" r="1.3" fill="currentColor" stroke="none"/>
                    </svg>
                    <span class="text-[11px]">Detalhe</span>
                </button>
                <button type="button" data-tab="otica" class="tab-btn flex flex-col items-center justify-center gap-1 py-2.5 rounded-xl transition-colors">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" class="w-5 h-5">
                        <circle cx="12" cy="12" r="9"/>
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 3v3.5M12 17.5V21M3 12h3.5M17.5 12H21"/>
                    </svg>
                    <span class="text-[11px]">Ótica</span>
                </button>
            </div>

            <!-- Sliders (renderizados via JS conforme a aba ativa) -->
            <div id="sliders-container" class="flex flex-col divide-y divide-zinc-800"></div>

        </main>

        <!-- Ações -->
        <footer class="grid grid-cols-3 gap-2 pt-3 px-2 shrink-0 border-t border-zinc-800">
            <button id="btn-reset" type="button" class="flex flex-col items-center gap-1 py-2 text-zinc-300 hover:text-white transition-colors">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                    <path d="M3 12a9 9 0 1 0 3-6.7"/>
                    <path d="M3 4v5h5"/>
                </svg>
                <span class="text-[11px]">Redefinir</span>
            </button>
            <button id="btn-historico" type="button" class="flex flex-col items-center gap-1 py-2 text-zinc-300 hover:text-white transition-colors">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M12 7v5l3.5 2"/>
                </svg>
                <span class="text-[11px]">Histórico</span>
            </button>
            <button id="btn-copiar" type="button" class="flex flex-col items-center gap-1 py-2 text-zinc-300 hover:text-white transition-colors">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                    <rect x="9" y="9" width="11" height="11" rx="1.5"/>
                    <path d="M5 15V5a1 1 0 0 1 1-1h10"/>
                </svg>
                <span class="text-[11px]">Copiar ajustes</span>
            </button>
        </footer>
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-zinc-800 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg z-50 opacity-0">
    </div>

    <script src="./js/ajustes.js"></script>

</div>
</body>
</html>
