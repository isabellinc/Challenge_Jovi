<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/output.css">
    <title>Jovi câmera</title>
</head>

<body class="bg-black text-white h-dvh w-screen overflow-hidden flex flex-col justify-between p-4">

    <nav class="flex justify-between items-center w-full px-2 pt-5">
    <div class="flex items-center gap-4">
        <img class="w-6 h-6 object-contain opacity-80 hover:opacity-100 hover:scale-110 cursor-pointer transition-all duration-200" src="./assets/camera/flash.png" alt="ícone do flash">
        <img class="w-6 h-6 object-contain opacity-80 hover:opacity-100 hover:scale-110 cursor-pointer transition-all duration-200" src="./assets/camera/filter.png" alt="ícone de filtro">
        <img class="w-6 h-6 object-contain opacity-80 hover:opacity-100 hover:scale-110 cursor-pointer transition-all duration-200" src="./assets/camera/clock.png" alt="ícone do temporizador">
        
        <a href="presets.html" class="flex items-center shrink-0 opacity-80 hover:opacity-100 hover:scale-110 cursor-pointer transition-all duration-200">
            <img class="w-6 h-6 object-contain" src="./assets/camera/presets.png" alt="ícone de presets">
        </a>
    </div>

    <div class="flex items-center gap-4 opacity-80 hover:opacity-100 hover:scale-110 cursor-pointer transition-all duration-200">
        <img class="w-6 h-6 object-contain" src="./assets/camera/settings.png" alt="ícone de configurações">
    </div>
</nav>

    <main class="flex-1 justify-center items-center ">
        
    
        <img class="max-h-full max-w-full object-contain mt-10" src="./assets/camera/background_camera.png" alt="escada que vai direto ao mar">
      <div class="flex justify-center items-center gap-2 my-2 text-[10px] font-semibold text-white pt-3 select-none">
        <span class="bg-zinc-800 px-2 py-1 rounded-md opacity-60 hover:opacity-100 hover:bg-zinc-700 cursor-pointer transition-all duration-200">1:1</span>
        <span class="bg-zinc-800 px-2 py-1 rounded-md opacity-60 hover:opacity-100 hover:bg-zinc-700 cursor-pointer transition-all duration-200">4:3</span>
        <span class="bg-zinc-800 px-2 py-1 rounded-md opacity-60 hover:opacity-100 hover:bg-zinc-700 cursor-pointer transition-all duration-200">16:9</span>
</div>
        <div class="grid grid-cols-5 items-center w-full text-center text-xs text-white mt-10">
            <p class="opacity-60 hover:opacity-100 hover:text-yellow-400 cursor-pointer transition-all">Noturno</p>
            <p class="opacity-60 hover:opacity-100 hover:text-yellow-400 cursor-pointer transition-all">Retrato</p>
            <p class="opacity-60 hover:opacity-100 hover:text-yellow-400 cursor-pointer transition-all">Foto</p>
            <p class="opacity-60 hover:opacity-100 hover:text-yellow-400 cursor-pointer transition-all">Vídeo</p>
            <p class="opacity-60 hover:opacity-100 hover:text-yellow-400 cursor-pointer transition-all">Ultra HD</p>
     
    </main>

    <footer class="grid grid-cols-3 items-center w-full pb-6 pt-2">

        <div class="justify-self-start pl-2">
            <img class="w-12 h-12 object-cover rounded-lg" src="./assets/camera/mini_background_camera.png" alt="miniatura">
        </div>

        <div class="justify-self-center">
            <img class="w-16 h-16 object-contain cursor-pointer" src="./assets/camera/camera_button.png" alt="botão disparador da câmera">
        </div>

        <div class="justify-self-end pr-2">
            <img class="w-10 h-10 object-contain cursor-pointer" src="./assets/camera/return_button.png" alt="botão de retornar">
        </div>

    </footer>

</body>
</html>
