<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/output.css">

    <title>Jovi câmera</title>
</head>

<body class="bg-zinc-950 min-h-dvh w-full flex items-center justify-center overflow-hidden">

    <div id="app-frame" class="relative bg-black text-white w-full h-dvh sm:h-[860px] sm:max-h-[94vh] sm:w-[430px] sm:rounded-[2.5rem] sm:border sm:border-zinc-800 sm:shadow-2xl overflow-hidden flex flex-col justify-between p-4">

        <nav class="flex justify-between items-center w-full px-2 pt-5 shrink-0">
            <div class="flex items-center gap-4">
                <img id="btn-flash" class="w-6 h-6 object-contain opacity-80 hover:opacity-100 hover:scale-110 cursor-pointer transition-all duration-200" src="./assets/camera/flash.png" alt="ícone do flash">

                <img id="btn-filter" class="w-6 h-6 object-contain opacity-80 hover:opacity-100 hover:scale-110 cursor-pointer transition-all duration-200" src="./assets/camera/filter.png" alt="ícone de filtro">

                <div class="relative">
                    <img id="btn-timer" class="w-6 h-6 object-contain opacity-80 hover:opacity-100 hover:scale-110 cursor-pointer transition-all duration-200" src="./assets/camera/clock.png" alt="ícone do temporizador">

                    <span id="timer-badge" class="hidden absolute -top-2 -right-2 bg-yellow-400 text-black text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">3</span>

                    <div id="timer-menu" class="hidden absolute top-9 left-0 bg-zinc-800/95 backdrop-blur rounded-lg py-1 flex flex-col z-50 text-xs min-w-[110px] shadow-lg">
                        <button data-timer="0" class="timer-option px-3 py-2 hover:bg-zinc-700 text-left text-white">Desligado</button>
                        <button data-timer="3" class="timer-option px-3 py-2 hover:bg-zinc-700 text-left text-white">3 segundos</button>
                        <button data-timer="5" class="timer-option px-3 py-2 hover:bg-zinc-700 text-left text-white">5 segundos</button>
                        <button data-timer="10" class="timer-option px-3 py-2 hover:bg-zinc-700 text-left text-white">10 segundos</button>
                    </div>
                </div>

                <a href="presets.html" class="flex items-center shrink-0 opacity-80 hover:opacity-100 hover:scale-110 cursor-pointer transition-all duration-200">
                    <img class="w-6 h-6 object-contain" src="./assets/camera/presets.png" alt="ícone de presets">
                </a>
            </div>

            <div class="flex items-center gap-4">
                <img id="btn-settings" class="w-6 h-6 object-contain opacity-80 hover:opacity-100 hover:scale-110 cursor-pointer transition-all duration-200" src="./assets/camera/settings.png" alt="ícone de configurações">
            </div>
        </nav>

        <main class="flex-1 flex flex-col w-full min-h-0">

            <div id="preview-area" class="flex-1 min-h-0 w-full flex items-center justify-center mt-4 sm:mt-6 [perspective:1200px]">

                <div id="preview-wrapper" class="relative overflow-hidden rounded-xl bg-zinc-900 shadow-lg transition-transform duration-200 [transform-style:preserve-3d]">

                    <img id="camera-preview"
                         class="w-full h-full object-cover transition-transform duration-300"
                         src="./assets/camera/background_camera.png"
                         alt="escada que vai direto ao mar">

                    <div id="grid-overlay" class="hidden absolute inset-0 pointer-events-none"></div>

                    <div id="countdown-overlay" class="hidden absolute inset-0 flex items-center justify-center pointer-events-none">
                        <span id="countdown-number" class="text-white text-8xl font-bold drop-shadow-lg"></span>
                    </div>

                    <div id="capture-flash" class="hidden absolute inset-0 bg-white opacity-0 pointer-events-none transition-opacity duration-150 ease-out"></div>

                    <span id="camera-label"
                          class="absolute top-2 left-2 bg-black/50 backdrop-blur text-[10px] px-2 py-1 rounded-full text-white pointer-events-none opacity-0 transition-opacity duration-300">
                        Traseira
                    </span>
                </div>
            </div>

            <div id="filters-strip"
                 class="hidden shrink-0 overflow-x-auto flex gap-3 px-2 py-3 w-full cursor-grab active:cursor-grabbing select-none scroll-smooth [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] [scrollbar-width:none]">

                <button data-filter="none" class="filter-option flex flex-col items-center gap-1 shrink-0 w-16">
                    <div class="w-16 h-16 shrink-0 rounded-lg overflow-hidden border-2 border-yellow-400 transition-colors">
                        <img src="./assets/camera/background_camera.png" class="w-full h-full object-cover pointer-events-none" style="filter:none" alt="">
                    </div>
                    <span class="text-[10px] text-white">Normal</span>
                </button>

                <button data-filter="grayscale(1)" class="filter-option flex flex-col items-center gap-1 shrink-0 w-16">
                    <div class="w-16 h-16 shrink-0 rounded-lg overflow-hidden border-2 border-transparent transition-colors">
                        <img src="./assets/camera/background_camera.png" class="w-full h-full object-cover pointer-events-none" style="filter:grayscale(1)" alt="">
                    </div>
                    <span class="text-[10px] text-white">P&amp;B</span>
                </button>

                <button data-filter="saturate(1.6) contrast(1.1)" class="filter-option flex flex-col items-center gap-1 shrink-0 w-16">
                    <div class="w-16 h-16 shrink-0 rounded-lg overflow-hidden border-2 border-transparent transition-colors">
                        <img src="./assets/camera/background_camera.png" class="w-full h-full object-cover pointer-events-none" style="filter:saturate(1.6) contrast(1.1)" alt="">
                    </div>
                    <span class="text-[10px] text-white">Vívido</span>
                </button>

                <button data-filter="sepia(0.45) contrast(0.9) brightness(1.05)" class="filter-option flex flex-col items-center gap-1 shrink-0 w-16">
                    <div class="w-16 h-16 shrink-0 rounded-lg overflow-hidden border-2 border-transparent transition-colors">
                        <img src="./assets/camera/background_camera.png" class="w-full h-full object-cover pointer-events-none" style="filter:sepia(0.45) contrast(0.9) brightness(1.05)" alt="">
                    </div>
                    <span class="text-[10px] text-white">Vintage</span>
                </button>

                <button data-filter="brightness(1.05) saturate(1.1) hue-rotate(180deg)" class="filter-option flex flex-col items-center gap-1 shrink-0 w-16">
                    <div class="w-16 h-16 shrink-0 rounded-lg overflow-hidden border-2 border-transparent transition-colors">
                        <img src="./assets/camera/background_camera.png" class="w-full h-full object-cover pointer-events-none" style="filter:brightness(1.05) saturate(1.1) hue-rotate(180deg)" alt="">
                    </div>
                    <span class="text-[10px] text-white">Frio</span>
                </button>

                <button data-filter="sepia(0.25) saturate(1.3) brightness(1.05)" class="filter-option flex flex-col items-center gap-1 shrink-0 w-16">
                    <div class="w-16 h-16 shrink-0 rounded-lg overflow-hidden border-2 border-transparent transition-colors">
                        <img src="./assets/camera/background_camera.png" class="w-full h-full object-cover pointer-events-none" style="filter:sepia(0.25) saturate(1.3) brightness(1.05)" alt="">
                    </div>
                    <span class="text-[10px] text-white">Quente</span>
                </button>

                <button data-filter="contrast(1.35) brightness(0.9) saturate(0.75)" class="filter-option flex flex-col items-center gap-1 shrink-0 w-16">
                    <div class="w-16 h-16 shrink-0 rounded-lg overflow-hidden border-2 border-transparent transition-colors">
                        <img src="./assets/camera/background_camera.png" class="w-full h-full object-cover pointer-events-none" style="filter:contrast(1.35) brightness(0.9) saturate(0.75)" alt="">
                    </div>
                    <span class="text-[10px] text-white">Dramático</span>
                </button>

                <span class="shrink-0 w-2" aria-hidden="true"></span>
            </div>

            <div id="aspect-row" class="flex justify-center items-center gap-2 my-2 text-[10px] font-semibold text-white pt-3 select-none shrink-0">
                <span class="aspect-option bg-zinc-800 px-2 py-1 rounded-md opacity-60 hover:opacity-100 hover:bg-zinc-700 cursor-pointer transition-all duration-200" data-aspect="1:1">1:1</span>
                <span class="aspect-option bg-zinc-800 px-2 py-1 rounded-md opacity-100 hover:bg-zinc-700 cursor-pointer transition-all duration-200" data-aspect="4:3">4:3</span>
                <span class="aspect-option bg-zinc-800 px-2 py-1 rounded-md opacity-60 hover:opacity-100 hover:bg-zinc-700 cursor-pointer transition-all duration-200" data-aspect="16:9">16:9</span>
            </div>

            <div class="grid grid-cols-5 items-center w-full text-center text-[10px] sm:text-xs text-white mt-4 sm:mt-6 shrink-0">
                <p class="mode-option opacity-60 hover:opacity-100 hover:text-yellow-400 cursor-pointer transition-all" data-mode="Noturno">Noturno</p>
                <p class="mode-option opacity-60 hover:opacity-100 hover:text-yellow-400 cursor-pointer transition-all" data-mode="Retrato">Retrato</p>
                <p class="mode-option opacity-100 text-yellow-400 cursor-pointer transition-all" data-mode="Foto">Foto</p>
                <p class="mode-option opacity-60 hover:opacity-100 hover:text-yellow-400 cursor-pointer transition-all" data-mode="Video">Vídeo</p>
                <p class="mode-option opacity-60 hover:opacity-100 hover:text-yellow-400 cursor-pointer transition-all" data-mode="UltraHD">Ultra HD</p>
            </div>
        </main>

        <footer class="grid grid-cols-3 items-center w-full pb-6 pt-2 shrink-0">

            <div class="justify-self-start pl-2 relative">
                <img id="thumbnail" class="w-12 h-12 object-cover rounded-lg cursor-pointer border border-zinc-700 hover:scale-105 transition-transform duration-200" src="./assets/camera/mini_background_camera.png" alt="miniatura da última foto">
                <span id="gallery-count" class="hidden absolute -top-1 -right-1 bg-yellow-400 text-black text-[9px] font-bold min-w-[16px] h-4 px-1 rounded-full flex items-center justify-center">1</span>
            </div>

            <div class="justify-self-center">
                <img id="capture-btn" class="w-16 h-16 object-contain cursor-pointer active:scale-90 transition-transform duration-100" src="./assets/camera/camera_button.png" alt="botão disparador da câmera">
            </div>

            <div class="justify-self-end pr-2">
                <img id="flip-btn" class="w-10 h-10 object-contain cursor-pointer" src="./assets/camera/return_button.png" alt="botão de virar a câmera">
            </div>

        </footer>

        <div id="toast" class="hidden absolute top-20 left-1/2 -translate-x-1/2 bg-black/70 backdrop-blur text-white text-xs px-3 py-2 rounded-full z-[60] pointer-events-none transition-opacity duration-300 opacity-0"></div>

        <div id="gallery-panel" class="hidden absolute inset-0 bg-zinc-950 z-[55] flex flex-col sm:rounded-[2.5rem] overflow-hidden">

            <header class="flex items-center justify-between px-5 pt-8 pb-4 shrink-0 border-b border-zinc-800">
                <button id="gallery-close" class="text-zinc-300 hover:text-white text-2xl leading-none w-8 text-left">&larr;</button>
                <h2 class="text-base font-semibold text-white">Galeria</h2>
                <span id="gallery-total" class="text-[11px] text-zinc-500 w-8 text-right">0</span>
            </header>

            <div id="gallery-grid" class="flex-1 overflow-y-auto p-4 grid grid-cols-3 gap-2 auto-rows-min content-start"></div>

            <p id="gallery-empty" class="hidden flex-1 flex items-center justify-center text-zinc-600 text-sm">
                Nenhuma foto ainda
            </p>
        </div>

        <div id="viewer-panel" class="hidden absolute inset-0 bg-black z-[58] flex flex-col sm:rounded-[2.5rem] overflow-hidden">
            <header class="flex items-center justify-between px-5 pt-8 pb-4 shrink-0">
                <button id="viewer-close" class="text-zinc-300 hover:text-white text-2xl leading-none">&larr;</button>
                <span id="viewer-info" class="text-[11px] text-zinc-400"></span>
                <button id="viewer-delete" class="text-red-400 hover:text-red-300 text-xs">Excluir</button>
            </header>

            <div class="flex-1 min-h-0 flex items-center justify-center p-4">
                <img id="viewer-image" class="max-w-full max-h-full object-contain rounded-xl" src="" alt="foto ampliada">
            </div>

            <div class="flex items-center justify-center gap-6 pb-8 pt-2 text-xs text-zinc-400 shrink-0">
                <button id="viewer-prev" class="hover:text-white px-3 py-1">&larr; Anterior</button>
                <button id="viewer-next" class="hover:text-white px-3 py-1">Próxima &rarr;</button>
            </div>
        </div>

        <div id="settings-overlay" class="hidden absolute inset-0 bg-black/60 z-40"></div>

        <div id="settings-panel" class="hidden absolute bottom-0 left-0 w-full bg-zinc-900 rounded-t-2xl sm:rounded-b-[2.5rem] p-5 z-50 max-h-[75%] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-white">Configurações</h2>
                <button id="close-settings" class="text-zinc-400 text-xl leading-none">&times;</button>
            </div>

            <div class="flex flex-col divide-y divide-zinc-800">
                <label class="flex items-center justify-between py-3 cursor-pointer">
                    <span class="text-sm text-white">Grade (linhas-guia)</span>
                    <span class="relative inline-flex items-center">
                        <input type="checkbox" id="setting-grid" class="sr-only peer">
                        <span class="w-10 h-[22px] bg-zinc-700 rounded-full peer-checked:bg-yellow-500 transition-colors duration-200"></span>
                        <span class="absolute left-[2px] top-1/2 -translate-y-1/2 w-[18px] h-[18px] bg-white rounded-full transition-transform duration-200 peer-checked:translate-x-[18px]"></span>
                    </span>
                </label>
                <label class="flex items-center justify-between py-3 cursor-pointer">
                    <span class="text-sm text-white">HDR automático</span>
                    <span class="relative inline-flex items-center">
                        <input type="checkbox" id="setting-hdr" class="sr-only peer">
                        <span class="w-10 h-[22px] bg-zinc-700 rounded-full peer-checked:bg-yellow-500 transition-colors duration-200"></span>
                        <span class="absolute left-[2px] top-1/2 -translate-y-1/2 w-[18px] h-[18px] bg-white rounded-full transition-transform duration-200 peer-checked:translate-x-[18px]"></span>
                    </span>
                </label>
                <label class="flex items-center justify-between py-3 cursor-pointer">
                    <span class="text-sm text-white">Marca d'água de localização</span>
                    <span class="relative inline-flex items-center">
                        <input type="checkbox" id="setting-location" class="sr-only peer">
                        <span class="w-10 h-[22px] bg-zinc-700 rounded-full peer-checked:bg-yellow-500 transition-colors duration-200"></span>
                        <span class="absolute left-[2px] top-1/2 -translate-y-1/2 w-[18px] h-[18px] bg-white rounded-full transition-transform duration-200 peer-checked:translate-x-[18px]"></span>
                    </span>
                </label>
                <label class="flex items-center justify-between py-3 cursor-pointer">
                    <span class="text-sm text-white">Espelhar foto frontal</span>
                    <span class="relative inline-flex items-center">
                        <input type="checkbox" id="setting-mirror" class="sr-only peer" checked>
                        <span class="w-10 h-[22px] bg-zinc-700 rounded-full peer-checked:bg-yellow-500 transition-colors duration-200"></span>
                        <span class="absolute left-[2px] top-1/2 -translate-y-1/2 w-[18px] h-[18px] bg-white rounded-full transition-transform duration-200 peer-checked:translate-x-[18px]"></span>
                    </span>
                </label>
                <label class="flex items-center justify-between py-3 cursor-pointer">
                    <span class="text-sm text-white">Som do obturador</span>
                    <span class="relative inline-flex items-center">
                        <input type="checkbox" id="setting-sound" class="sr-only peer" checked>
                        <span class="w-10 h-[22px] bg-zinc-700 rounded-full peer-checked:bg-yellow-500 transition-colors duration-200"></span>
                        <span class="absolute left-[2px] top-1/2 -translate-y-1/2 w-[18px] h-[18px] bg-white rounded-full transition-transform duration-200 peer-checked:translate-x-[18px]"></span>
                    </span>
                </label>

                <div class="py-3">
                    <span class="text-sm text-white block mb-2">Resolução</span>
                    <div class="flex gap-2">
                        <button data-res="12MP" class="res-option px-3 py-1.5 rounded-md bg-yellow-500 text-black text-xs">12MP</button>
                        <button data-res="48MP" class="res-option px-3 py-1.5 rounded-md bg-zinc-800 text-white text-xs">48MP</button>
                        <button data-res="108MP" class="res-option px-3 py-1.5 rounded-md bg-zinc-800 text-white text-xs">108MP</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="./js/script.js"></script>
</body>
</html>
